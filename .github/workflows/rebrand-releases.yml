name: Curate confirmed select. slot. release history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebrand-releases.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: select-slot-release-history
  cancel-in-progress: false

jobs:
  curate:
    if: github.repository == 'Sinastrax/select-slot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Keep the latest releases and confirmed firmware checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          keep = {
              "v1.15.3-rgsp.3": "select. slot. 1.15.3 Ver. 3 — Legacy 1.15.3",
              "v1.16.0-rgsp.4": "select. slot. 1.16.0 Ver. 4 — Known-Good Authentic Baseline",
              "v1.16.0-rgsp.17": "select. slot. 1.16.0 Ver. 17 — Pocket Color & SGB",
              "v1.16.0-rgsp.18": "select. slot. 1.16.0 Ver. 18 — GBA Authentic Fit",
              "v1.16.0-rgsp.24": "select. slot. 1.16.0 Ver. 24 — Latest H700",
              "miyoo-v1.8.1-ver2": "select. slot. 1.8.1 Ver. 2 — Miyoo",
          }

          def gh(*args):
              return subprocess.check_output(["gh", *args], text=True).strip()

          # Never delete unrelated projects/releases or a newly published version.
          lines = gh("api", "--paginate", "--jq", ".[] | @json",
                     f"repos/{repo}/releases?per_page=100").splitlines()
          releases = [json.loads(line) for line in lines if line.strip()]
          by_tag = {r["tag_name"]: r for r in releases}
          assert len(by_tag) == len(releases), "Duplicate release tags"
          assert set(keep).issubset(by_tag), "A required checkpoint is missing"
          assert gh("api", f"repos/{repo}/releases/latest", "--jq", ".tag_name") == "v1.16.0-rgsp.24", "H700 latest release changed"
          allowed = re.compile(r"(?:v1\\.(?:15\\.3|16\\.0)-rgsp\\.\\d+|miyoo-v1\\.8\\.1-ver\\d+)\\Z")
          for r in releases:
              assert allowed.fullmatch(r["tag_name"]), f"Unknown release: {r['tag_name']}"
              if r["tag_name"] in keep:
                  assert not r["draft"] and not r["prerelease"] and r["assets"], f"Incomplete kept release: {r['tag_name']}"

          for tag, title in keep.items():
              r = by_tag[tag]
              if r.get("name") != title:
                  gh("api", "--method", "PATCH", f"repos/{repo}/releases/{r['id']}",
                     "-f", f"name={title}")
                  print(f"Renamed: {tag} -> {title}", flush=True)

          for r in releases:
              if r["tag_name"] not in keep:
                  # Deleting GitHub Releases does not delete source history or tags.
                  # Keep tags intact so existing OTA version identifiers remain valid.
                  gh("api", "--method", "DELETE",
                     f"repos/{repo}/releases/{r['id']}")
                  print(f"Removed trial/intermediate release: {r['tag_name']}", flush=True)

          remaining = [json.loads(line) for line in gh(
              "api", "--paginate", "--jq", ".[] | @json",
              f"repos/{repo}/releases?per_page=100").splitlines() if line.strip()]
          assert {r["tag_name"] for r in remaining} == set(keep), "Unexpected remaining release set"
          assert all(r["name"] == keep[r["tag_name"]] for r in remaining), "Release title mismatch"
          assert gh("api", f"repos/{repo}/releases/latest", "--jq", ".tag_name") == "v1.16.0-rgsp.24", "Latest H700 changed"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Retained {len(keep)} releases; removed {len(releases)-len(keep)} trial/intermediate releases.\\n")
              summary.write("Original Git tags and download assets of retained releases are preserved.\\n")
          print(f"Complete: {len(keep)} kept, {len(releases)-len(keep)} removed", flush=True)
          PY
