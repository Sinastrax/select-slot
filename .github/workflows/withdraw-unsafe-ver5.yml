name: Withdraw unstable v1.16.0-rgsp.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/withdraw-unsafe-ver5.yml"

permissions:
  contents: write

jobs:
  withdraw:
    if: github.repository == 'Sinastrax/select-slot'
    runs-on: ubuntu-24.04
    steps:
      - name: Withdraw broken Ver. 5 and restore Ver. 4 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          bad="v1.16.0-rgsp.5"
          stable="v1.16.0-rgsp.4"
          test "$repo" = "Sinastrax/select-slot"
          gh api "repos/$repo/releases/tags/$stable" --jq '.tag_name' | grep -Fx "$stable"
          gh api "repos/$repo/releases/tags/$bad" --jq '.tag_name' | grep -Fx "$bad"
          gh release edit "$bad" --repo "$repo" --draft
          gh release edit "$stable" --repo "$repo" --latest
          gh api "repos/$repo/releases/tags/$bad" --jq '.draft' | grep -Fx true
          gh api "repos/$repo/releases/latest" --jq '.tag_name' | grep -Fx "$stable"
          echo "WITHDRAWN: $bad is a draft; $stable is now the latest public release"
