name: One-time check protected merged-branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branch-prune-check.yml'
permissions:
  contents: write
jobs:
  prune-one:
    if: github.repository == 'Sinastrax/select-slot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only merged and explicitly verified PR39 branch if permitted
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo='Sinastrax/select-slot'
          branch='feature/clarify-fixed-shortcut-reference'
          expected='462fc9f314c43609e3192a22261c90b59709bcd9'
          token=os.environ['GITHUB_TOKEN']
          h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'select-slot-safe-branch-prune'}
          def req(method,path):
              with urllib.request.urlopen(urllib.request.Request('https://api.github.com'+path,method=method,headers=h),timeout=30) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else None
          ref=req('GET','/repos/'+repo+'/git/ref/heads/'+branch)
          pr=req('GET','/repos/'+repo+'/pulls/39')
          assert ref['object']['sha']==expected
          assert pr['merged'] is True and pr['head']['ref']==branch and pr['state']=='closed'
          try:
              req('DELETE','/repos/'+repo+'/git/refs/heads/'+branch)
              print('Deleted safe, merged branch: '+branch)
          except urllib.error.HTTPError as e:
              print('Branch deletion blocked; preserving Owner Only – Protect All Branches ruleset. HTTP',e.code,e.read().decode()[:400],flush=True)
              raise
          PY
