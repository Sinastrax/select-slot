name: Compare older mGBA core (H700)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/compare-mgba-core.yml"

permissions:
  contents: read

jobs:
  old-mgba:
    runs-on: ubuntu-24.04-arm
    container:
      image: rust:1-bullseye
    timeout-minutes: 90
    steps:
      - name: Checkout custom patches
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends cmake git curl ca-certificates build-essential pkg-config libpng-dev bison flex zip file

      - name: Fetch identical upstream Slot core build recipe
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/pvaibhav/slot/archive/refs/tags/v1.15.3-pvaibhav.1.tar.gz" \
            -o /tmp/upstream-slot.tar.gz
          mkdir upstream
          tar -xzf /tmp/upstream-slot.tar.gz --strip-components=1 -C upstream

      - name: Build older upstream mGBA libretro core
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          # The October 2025 core reported to work without the newer SGB timing bug.
          OLD_MGBA=c758314a639aa0066e7b65a8341448181b73c804
          mkdir -p ../older-mgba/System
          # Build the older upstream core without later Slot-specific mGBA patches:
          # several patches target newer GB memory-controller code and cannot
          # be transplanted without independently porting and testing them.
          mkdir -p target-device/mgba-old/source
          git -C target-device/mgba-old/source init -q
          git -C target-device/mgba-old/source fetch -q --depth 1 https://github.com/libretro/mgba "$OLD_MGBA"
          git -C target-device/mgba-old/source checkout -q --detach FETCH_HEAD
          # The 2025 CMake list incorrectly adds scripting.c to the
          # minimal libretro source set even when scripting is disabled.
          # Exclude that optional module rather than enabling unsupported
          # directory/scripting APIs just to satisfy the compiler.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("target-device/mgba-old/source/src/core/CMakeLists.txt")
          src = path.read_text()
          old = "rewind.c\n\tscripting.c\n\tsync.c"
          assert old in src, "2025 core source layout changed"
          path.write_text(src.replace(old, "rewind.c\n\tsync.c", 1))
          # The older libretro target also links duplicate compatibility
          # functions and version constants. Remove redundant definitions only.
          retro = Path("target-device/mgba-old/source/src/platform/libretro/libretro.c")
          text = retro.read_text()
          for duplicate in ('const char* const projectVersion = "0.11-dev" GIT_VERSION;\n',
                            'const char* const projectName = "mGBA";\n'):
              assert duplicate in text
              text = text.replace(duplicate, "", 1)
          retro.write_text(text)
          root = Path("target-device/mgba-old/source/CMakeLists.txt")
          cmake = root.read_text()
          marker = "file(GLOB RETRO_SRC ${CMAKE_CURRENT_SOURCE_DIR}/src/platform/libretro/*.c)"
          assert marker in cmake
          cmake = cmake.replace(marker, marker + '\n\tlist(REMOVE_ITEM RETRO_SRC "${CMAKE_CURRENT_SOURCE_DIR}/src/platform/libretro/memory.c")', 1)
          target = 'add_library(${BINARY_NAME}_libretro SHARED ${CORE_SRC} ${RETRO_SRC} ${CORE_VFS_SRC})'
          assert target in cmake
          # The legacy libretro target uses VFileOpenFD but omits its
          # implementation from CORE_VFS_SRC. Add only that source.
          cmake = cmake.replace(target, target + '\n\ttarget_sources(${BINARY_NAME}_libretro PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/src/util/vfs/vfs-fd.c)', 1)
          root.write_text(cmake)
          PY
          cmake -S target-device/mgba-old/source -B target-device/mgba-old/build \
            -DLIBMGBA_ONLY=ON -DBUILD_LIBRETRO=ON -DENABLE_SCRIPTING=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-flto=auto"
          cmake --build target-device/mgba-old/build --target mgba_libretro \
            --parallel "$(getconf _NPROCESSORS_ONLN)"
          cp target-device/mgba-old/build/mgba_libretro.so ../older-mgba/System/mgba_libretro.so
          # Refuse to ship a core with undefined symbols the frontend cannot provide.
          if nm -D -u ../older-mgba/System/mgba_libretro.so | grep -E ' U (VFileOpenFD|VFileFromFD)$'; then
            echo "Legacy libretro core still lacks its own VFS implementation" >&2
            exit 1
          fi
          file ../older-mgba/System/mgba_libretro.so | grep -E "ARM aarch64|ARM64|aarch64"
          sha256sum ../older-mgba/System/mgba_libretro.so > ../older-mgba/mgba.sha256
          echo "$OLD_MGBA" > ../older-mgba/mgba-commit.txt

      - name: Package old-core-only test
        shell: bash
        run: |
          set -euo pipefail
          cd older-mgba
          zip -qry ../select-slot-older-mgba-core-only.zip System
          unzip -l ../select-slot-older-mgba-core-only.zip

      - name: Upload old-core-only update
        uses: actions/upload-artifact@v4
        with:
          name: select-slot-older-mgba-core-only
          path: select-slot-older-mgba-core-only.zip
          if-no-files-found: error
