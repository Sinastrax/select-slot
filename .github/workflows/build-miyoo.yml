name: Verify select. slot. Miyoo ARMv7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "miyoo/**"
      - ".github/workflows/build-miyoo.yml"
  pull_request:
    paths:
      - "miyoo/**"
      - ".github/workflows/build-miyoo.yml"

concurrency:
  group: select-slot-miyoo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-miyoo:
    name: Miyoo Mini / Mini Plus / Flip (ARMv7)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out select. slot. sources
        uses: actions/checkout@v4

      - name: Install Task
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check Miyoo source-level regression contracts
        shell: bash
        run: python3 -m unittest discover -s miyoo/tests -p 'test_*.py' -v

      - name: Build Miyoo offline release
        shell: bash
        run: bash miyoo/build.sh

      - name: Check actual generated Rust patch against regression contracts
        shell: bash
        env:
          MIYOO_GENERATED_PATCH: .build/miyoo/slot-miyoo/patches/0028-select-miyoo-config.patch
        run: python3 -m unittest discover -s miyoo/tests -p 'test_*.py' -v

      - name: Run ARMv7/QEMU graphics and power tests
        shell: bash
        run: |
          set -euo pipefail
          cd .build/miyoo/slot-miyoo
          task test

      - name: Verify the release is a card-root install, not H700 firmware
        shell: bash
        run: |
          set -euo pipefail
          source miyoo/version.env
          archive=$(find .build/miyoo -maxdepth 1 -name 'select-slot-*-miyoo.zip' -print -quit)
          test -n "$archive"
          unzip -t "$archive" | tail -1
          unzip -Z1 "$archive" | grep -qx "App/Slot/config.json"
          unzip -Z1 "$archive" | grep -qx "Apps/slot.pak/config.json"
          unzip -Z1 "$archive" | grep -qx "System/slot"
          unzip -Z1 "$archive" | grep -qx "System/select-slot-version.txt"
          unzip -Z1 "$archive" | grep -qx "System/licenses/build-info.txt"
          sha256sum -c "$archive.sha256"
          onion="$(dirname "$archive")/$(basename "$archive" .zip)-onion-autoboot.zip"
          stock="$(dirname "$archive")/$(basename "$archive" .zip)-stock-autoboot.zip"
          for variant in "$onion" "$stock"; do
            test -s "$variant"
            test -s "$variant.sha256"
            unzip -t "$variant" | tail -1 | grep -q 'No errors detected'
            actual="$(sha256sum "$variant" | cut -d' ' -f1)"
            expected="$(awk 'NR==1 {print $1}' "$variant.sha256")"
            test "$actual" = "$expected"
            unzip -Z1 "$variant" | grep -qx 'System/slot'
          done
          # Ver. 3 ships only mGBA and gpSP. A stale Gambatte core,
          # source archive or launch entry must fail the build.
          for variant in "$archive" "$onion" "$stock"; do
            ! unzip -Z1 "$variant" | grep -Eiq 'gambatte'
            unzip -Z1 "$variant" | grep -qx 'System/mgba_libretro.so'
            unzip -Z1 "$variant" | grep -qx 'System/gpsp_libretro.so'
            unzip -p "$variant" 'System/select-slot-version.txt' | grep -Fq "Ver. $CUSTOM_VERSION"
          done
          test ! -e .build/miyoo/slot-miyoo/cores/gambatte
          grep -Fq '"gambatte" => Some(Core::Mgba),' \
            .build/miyoo/slot-miyoo/patches/0028-select-miyoo-config.patch
          # Both menu contexts use their own HUD ink, and all quick-menu
          # pages scroll within their viewport rather than crossing the footer.
          patch=.build/miyoo/slot-miyoo/patches/0028-select-miyoo-config.patch
          grep -Fq '+    !page.is_empty()' "$patch"
          grep -Fq "-            Phase::About if action == Action::GbaDown(Btn::X) => self.begin_restart()," "$patch"
          grep -Fq "-        self.draw_side_legend(restart, true, link_legend_y(), out);" "$patch"
          grep -Fq '+    menu_battery_percent: slot_ui::Printed,' "$patch"
          grep -Fq '+    menu_clock: slot_ui::Printed,' "$patch"
          grep -Fq "+        version: \"$SLOT_VERSION Ver. $CUSTOM_VERSION\"," "$patch"
          ! grep -Eq '^\+.*QuickRow::Restart' "$patch"

          unzip -Z1 "$onion" | grep -qx '.tmp_update/startup/select-slot.sh'
          ! unzip -Z1 "$onion" | grep -qx '.tmp_update/runtime.sh'
          unzip -Z1 "$stock" | grep -qx '.tmp_update/runtime.sh'
          ! unzip -Z1 "$stock" | grep -qx '.tmp_update/startup/select-slot.sh'
          ! unzip -Z1 "$archive" | grep -q '^.tmp_update/'


      - name: Upload verified ZIPs and checksums (CI artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: select-slot-miyoo-build-artifact
          path: |
            .build/miyoo/select-slot-*-miyoo*.zip
            .build/miyoo/select-slot-*-miyoo*.zip.sha256
          if-no-files-found: error
          retention-days: 30

