name: Publish select. slot. release

on:
  workflow_run:
    workflows:
      - Build select. slot. H700
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified full-build artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: select-slot-complete-h700
          path: release
          github-token: ${{ github.token }}

      - name: Validate package, version and SHA-256
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/ota-version.txt" --jq '.content' | base64 -d | tr -d '\r\n')"
          echo "Current version on main: $current"
          python3 - "$current" <<'PY'
          import hashlib, json, os, pathlib, sys
          expected = sys.argv[1]
          release = pathlib.Path("release")
          stable = json.loads((release / "versions.json").read_text())["stable"]
          version = stable["version"]
          assert version == expected, f"Stale build {version}, main is now {expected}"
          assert any("-" + n + "." in version for n in ("rgsp", "custom", "select")), version
          assert stable["tag"] == "v" + version
          assert stable["zip"] == "slot-v" + version + "-h700.zip"
          archive = release / stable["zip"]
          assert archive.is_file()
          assert archive.stat().st_size == stable["size"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == stable["sha256"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as result:
              print("tag=" + stable["tag"], file=result)
              print("zip=" + stable["zip"], file=result)
          PY

      - name: Publish only new, complete custom firmware
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          ZIP: ${{ steps.manifest.outputs.zip }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's "releases/tags/<tag>" API returns 404 for drafts, so find
          # the withdrawn release in the complete repository release listing.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\\(.id):\\(.draft)\"" | head -n1)"
          if [ -n "$existing" ]; then
            existing_id="${existing%%:*}"
            existing_draft="${existing##*:}"
            if [ "$existing_draft" != true ]; then
              echo "$TAG is already published; never replace a public release."
              exit 0
            fi
            echo "Found withdrawn $TAG draft #$existing_id; replace only with a verified package."
            # Delete the withdrawn draft (including its bad ZIP). Git source
            # history and the original failed build's CI artifact are retained.
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$existing_id" >/dev/null
          fi
          # The original Ver. 5 tag points to the crashing build. Update the
          # tag to the exact, verified replacement commit before publishing.
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$tag_sha" ]; then
            # Release creation may reject a raw commit as an implicit tag target.
            # Create the verified annotated reference explicitly first.
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$HEAD_SHA" >/dev/null
          elif [ "$tag_sha" != "$HEAD_SHA" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$HEAD_SHA" -F force=true >/dev/null
          fi
          # Release notes are version-specific; never repeat the cumulative feature list.
          gh api "repos/$GITHUB_REPOSITORY/contents/RELEASE_NOTES.md?ref=$HEAD_SHA" --jq '.content' | base64 -d > release-notes.md
          test -s release-notes.md
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(rgsp|custom|select)\.([0-9]+)$ ]]; then
            DISPLAY_VERSION="${BASH_REMATCH[1]} Ver. ${BASH_REMATCH[3]}"
          else
            DISPLAY_VERSION="${TAG#v}"
          fi
          gh release create "$TAG" "release/$ZIP" release/versions.json \
            --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --latest \
            --title "select. slot. $DISPLAY_VERSION" \
            --notes-file release-notes.md
          # Ensure the replacement rather than the withdrawn build is latest.
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' | grep -Fx "$TAG"
