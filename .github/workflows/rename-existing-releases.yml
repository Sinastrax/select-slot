name: Correct existing Custom slot release titles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rename-existing-releases.yml"

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-24.04
    steps:
      - name: Rename existing releases, preserve OTA tags and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Never change technical tags or asset names: installed updater URLs rely on them.
          for n in 1 2 3; do
            gh release view "v1.15.3-rgsp.$n" --repo "$GITHUB_REPOSITORY" >/dev/null
          done

          cat > /tmp/release-1.md <<'NOTES'
          ## Custom slot. Ver. 1.15.3.1

          **First complete Custom slot firmware release.**

          - Added online updates from this project's GitHub Releases through Settings → System → Check for Updates.
          - Added a full H700 installation/update package with checksum validation.

          [Complete feature list](https://github.com/Sinastrax/slot-rgsp-mod#what-this-fork-adds)
          NOTES

          cat > /tmp/release-2.md <<'NOTES'
          ## Changes in Ver. 1.15.3.2

          - Added separate **Menu Screen Off** and **Menu Power Off** timers in Settings → System.
          - Each timer offers **Off, 1, 3, 5, 10, 15 and 30 minutes**; defaults are **3 minutes** for the screen and **15 minutes** for shutdown.
          - Inactivity timers work on the shelf and menus, not during gameplay. A key press restores a blanked display.
          NOTES

          cat > /tmp/release-3.md <<'NOTES'
          ## Changes in Ver. 1.15.3.3

          - Fixed **Resume on Power On**: Off now starts at the game shelf without automatically launching the previously played game.
          - The last played game remains selected.
          - **Resume on Insert** remains independent for manual game launches.
          NOTES

          gh release edit v1.15.3-rgsp.1 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Custom slot. Ver. 1.15.3.1" \
            --notes-file /tmp/release-1.md

          gh release edit v1.15.3-rgsp.2 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Custom slot. Ver. 1.15.3.2" \
            --notes-file /tmp/release-2.md

          gh release edit v1.15.3-rgsp.3 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Custom slot. Ver. 1.15.3.3" \
            --notes-file /tmp/release-3.md \
            --latest

          # The earlier branding-only custom.1 was unnecessary: restore rgsp.3 as latest.
          if gh release view v1.15.3-custom.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v1.15.3-custom.1 \
              --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          test "$latest" = "v1.15.3-rgsp.3"
          for n in 1 2 3; do
            title="$(gh release view "v1.15.3-rgsp.$n" --repo "$GITHUB_REPOSITORY" --json name --jq .name)"
            test "$title" = "Custom slot. Ver. 1.15.3.$n"
          done
          echo "All release titles corrected; original firmware tags and downloads preserved."
