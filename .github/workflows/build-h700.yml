name: Build Custom slot H700

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*-custom.*"
      - "v*-rgsp.*"
    paths:
      - "patches/**"
      - ".github/workflows/build-h700.yml"
      - ".github/ota-version.txt"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  build-h700:
    runs-on: ubuntu-24.04-arm
    container:
      image: rust:1-bullseye
    timeout-minutes: 120
    steps:
      - name: Checkout modifications
        uses: actions/checkout@v4

      - name: Fetch the exact upstream Slot release and apply modifications
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/pvaibhav/slot/archive/refs/tags/v1.15.3-pvaibhav.1.tar.gz" \
            -o /tmp/upstream-slot.tar.gz
          mkdir upstream
          tar -xzf /tmp/upstream-slot.tar.gz --strip-components=1 -C upstream
          cd upstream
          git apply --check ../patches/rgsp-authentic-gbc.patch
          git apply ../patches/rgsp-authentic-gbc.patch
          git apply --check ../patches/pocket-color.patch
          git apply ../patches/pocket-color.patch
          git apply --check ../patches/pocket-color-gbc-correction.patch
          git apply ../patches/pocket-color-gbc-correction.patch
          git apply --check ../patches/sgb-pocket-pixel-separation.patch
          git apply ../patches/sgb-pocket-pixel-separation.patch
          git apply --check ../patches/core-specific-gb-screen-sgb-correction-performance.patch
          git apply ../patches/core-specific-gb-screen-sgb-correction-performance.patch
          git apply --check ../patches/sameboy-authentic-correction.patch
          git apply ../patches/sameboy-authentic-correction.patch
          git apply --check ../patches/sameboy-build-fixes.patch
          git apply ../patches/sameboy-build-fixes.patch
          git apply --check ../patches/per-core-authentic-color-correction.patch
          git apply ../patches/per-core-authentic-color-correction.patch
          git apply --check ../patches/color-transfer-only-gambatte-sgb-fix.patch
          git apply ../patches/color-transfer-only-gambatte-sgb-fix.patch
          git apply --check ../patches/restore-mgba-gb-and-disable-autoframeskip.patch
          git apply ../patches/restore-mgba-gb-and-disable-autoframeskip.patch
          git apply --check ../patches/mgba-drift-and-authentic-color-consistency.patch
          git apply ../patches/mgba-drift-and-authentic-color-consistency.patch
          git apply --check ../patches/mgba-native-pitch-neutral-authentic-white.patch
          git apply ../patches/mgba-native-pitch-neutral-authentic-white.patch
          git apply --check ../patches/mgba-audio-overflow-crossfade.patch
          git apply ../patches/mgba-audio-overflow-crossfade.patch
          git apply --check ../patches/authentic-color-response-only.patch
          git apply ../patches/authentic-color-response-only.patch
          git apply --check ../patches/mgba-gb-buffer-recovery.patch
          git apply ../patches/mgba-gb-buffer-recovery.patch
          git apply --check ../patches/rg34xxsp-extra-hotkeys.patch
          git apply ../patches/rg34xxsp-extra-hotkeys.patch
          git apply --check ../patches/rgsp-online-updates.patch
          git apply ../patches/rgsp-online-updates.patch
          for patch in menu-idle-settings menu-idle-behavior menu-idle-timer; do
            git apply --check "../patches/${patch}.patch"
            git apply "../patches/${patch}.patch"
          done
          git apply --check ../patches/resume-power-on-do-not-autolaunch.patch
          git apply ../patches/resume-power-on-do-not-autolaunch.patch
          echo "Exact-release patches applied"

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip unzip cmake file curl ca-certificates git build-essential pkg-config libpng-dev bison flex bsdextrautils
          task_tgz=task_linux_arm64.tar.gz
          curl -fsSLO --http1.1 --retry 5 --retry-delay 10 --retry-all-errors \
            "https://github.com/go-task/task/releases/download/v3.54.0/$task_tgz"
          echo "d7189d439d4a6058e39e1b2acd7c8b27acd4856691b408f23b242e4294e1df5b  $task_tgz" | sha256sum -c -
          tar -xzf "$task_tgz" -C /usr/local/bin task
          rm "$task_tgz"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-all-errors https://bun.sh/install \
              | BUN_INSTALL=/usr/local bash -s "bun-v1.2.6"; then
              break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 10
          done

      - name: Verify Rust formatting
        working-directory: upstream
        shell: bash
        run: cargo fmt --all

      - name: Verify online-update version comparison and ZIP safety
        working-directory: upstream
        shell: bash
        run: |
          cargo test -p slot --no-default-features --features device --test update -- --nocapture
          cargo test -p slot --no-default-features --features device --lib menu_idle::tests -- --nocapture
          cargo test -p slot --no-default-features --features device --test boot -- --nocapture

      - name: Build the H700 device tree
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          export SLOT_VERSION="$(cat ../.github/ota-version.txt)"
          task dist:device OUT=custom-slot-h700

      - name: Replace stock mGBA with the verified older core
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          bash ../.github/scripts/build-stable-mgba.sh custom-slot-h700
          test -s custom-slot-h700/System/licenses/mgba-stable.sha256
          test -s custom-slot-h700/System/licenses/mgba-c758314a639aa0066e7b65a8341448181b73c804-source.tar.gz

      - name: Verify the complete firmware tree
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          sh tools/check-card-tree.sh custom-slot-h700
          test ! -f custom-slot-h700/System/sameboy_libretro.so
          sha256sum -c custom-slot-h700/System/licenses/mgba-stable.sha256
          # Both boot scripts and every core must be in an OTA update.
          test -s custom-slot-h700/System/launch_frontend.sh
          test -s custom-slot-h700/System/gpsp_libretro.so
          test -s custom-slot-h700/System/gambatte_libretro.so

      - name: Package full firmware and OTA release manifest
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat ../.github/ota-version.txt)"
          zip="slot-v${version}-h700.zip"
          zip -qry "../$zip" custom-slot-h700
          VERSION="$version" ZIP="$zip" python3 - <<'PY'
          import hashlib, json, os, pathlib
          filename = pathlib.Path("..") / os.environ["ZIP"]
          payload = filename.read_bytes()
          result = {"stable": {
              "version": os.environ["VERSION"],
              "tag": "v" + os.environ["VERSION"],
              "zip": os.environ["ZIP"],
              "size": len(payload),
              "sha256": hashlib.sha256(payload).hexdigest()}}
          pathlib.Path("../versions.json").write_text(json.dumps(result, indent=2) + "\n")
          print(result)
          PY
          unzip -t "../$zip" | tail -1

      - name: Upload complete OTA-ready firmware
        uses: actions/upload-artifact@v4
        with:
          name: custom-slot-complete-h700
          path: |
            slot-v*-h700.zip
            versions.json
          if-no-files-found: error

  release-h700:
    name: Publish complete custom firmware for online updates
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-h700
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: custom-slot-complete-h700
          path: release

      - name: Verify version and archive checksum before publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path("release")
          d = json.loads((root / "versions.json").read_text())["stable"]
          assert d["tag"] == os.environ["RELEASE_TAG"], (d["tag"], os.environ["RELEASE_TAG"])
          archive = root / d["zip"]
          assert archive.is_file(), d["zip"]
          assert archive.stat().st_size == d["size"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == d["sha256"]
          print("Validated", archive.name, d["sha256"])
          PY

      - uses: actions/checkout@v4

      - name: Publish update assets on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          zip="release/slot-${RELEASE_TAG}-h700.zip"
          test -s "$zip"
          TAG="$RELEASE_TAG"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(rgsp|custom)\.([0-9]+)$ ]]; then
            DISPLAY_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[3]}"
          else
            DISPLAY_VERSION="${TAG#v}"
          fi
          gh release create "$RELEASE_TAG" "$zip" release/versions.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Custom slot. Ver. $DISPLAY_VERSION" \
            --notes-file RELEASE_NOTES.md
