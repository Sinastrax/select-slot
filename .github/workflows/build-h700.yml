          cmp card/System/bootlogo.bmp select-slot-h700/System/bootlogo.bmp
          grep -qF 'say "UPDATING SELECT. SLOT."' card/System/launch_frontend.sh
          test -s select-slot-h700/System/gpsp_libretro.so
          test -s select-slot-h700/System/gambatte_libretro.so
          test -s select-slot-h700/System/armgba_libretro.so
          test -s select-slot-h700/System/licenses/armgba-src.tar.gz || \
            compgen -G 'select-slot-h700/System/licenses/armgba-*.tar.gz' > /dev/null
          test -s select-slot-h700/System/bezels/640x480.png
          test -s select-slot-h700/System/bezels/640x480-gba-original.png
          test -s select-slot-h700/System/licenses/gba-original-bezel-credits.txt

      - name: Package full firmware and OTA release manifest
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/integration/slot-1.16.0-armgba" ]]; then
            version="1.16.0-select.${GITHUB_RUN_NUMBER}"
          else
            version="$(cat ../.github/ota-version.txt)"
          fi
          zip="slot-v${version}-h700.zip"
          zip -qry "../$zip" select-slot-h700
          VERSION="$version" ZIP="$zip" python3 - <<'PY'
          import hashlib, json, os, pathlib
          filename = pathlib.Path("..") / os.environ["ZIP"]
          payload = filename.read_bytes()
          result = {"stable": {
              "version": os.environ["VERSION"],
              "tag": "v" + os.environ["VERSION"],
              "zip": os.environ["ZIP"],
              "size": len(payload),
              "sha256": hashlib.sha256(payload).hexdigest()}}
          pathlib.Path("../versions.json").write_text(json.dumps(result, indent=2) + "\n")
          print(result)
          PY
          unzip -t "../$zip" | tail -1

      - name: Upload complete OTA-ready firmware
        uses: actions/upload-artifact@v4
        with:
          name: select-slot-complete-h700
          path: |
            slot-v*-h700.zip
            versions.json
            upstream/source-release/mgba-*-source.tar.gz
            upstream/source-release/armgba-*.tar.gz
          if-no-files-found: error

  release-test-h700:
    name: Publish isolated H700 test OTA
    if: github.ref == 'refs/heads/integration/slot-1.16.0-armgba' && github.event_name == 'push'
    needs: build-h700
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: select-slot-complete-h700
          path: release

      - name: Verify and publish prerelease without changing stable latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path("release")
          manifest = json.loads((root / "versions.json").read_text())["stable"]
          expected = "1.16.0-select." + os.environ["RUN_NUMBER"]
          assert os.environ["RELEASE_REF"] == "refs/heads/integration/slot-1.16.0-armgba"
          assert manifest["version"] == expected, (manifest["version"], expected)
          assert manifest["tag"] == "v" + expected
          archive = root / manifest["zip"]
          assert archive.is_file() and archive.stat().st_size == manifest["size"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest["sha256"]
          assert list(root.glob("upstream/source-release/armgba-*.tar.gz")), "Missing armGBA source archive"
          print("Validated isolated test OTA", manifest["tag"], manifest["sha256"])
          PY
          tag="v1.16.0-select.${RUN_NUMBER}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Test release $tag already exists; preserving its published assets."
          else
            gh release create "$tag" \
              "release/slot-${tag}-h700.zip" \
              release/versions.json \
              release/upstream/source-release/mgba-c758314a639aa0066e7b65a8341448181b73c804-source.tar.gz \
              release/upstream/source-release/armgba-*.tar.gz \
              --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "select. slot. 1.16.0 Test ${RUN_NUMBER}" \
              --notes "Isolated H700 test OTA. It does not update the stable release channel."
          fi

          # Keep the OTA pointer on its own branch. Test firmware reads this raw
          # manifest; stable firmware continues to read Releases/latest.
          gh api "repos/$GH_REPO/git/ref/heads/test-ota" >/dev/null
          existing_sha="$(gh api "repos/$GH_REPO/contents/versions.json?ref=test-ota" --jq .sha 2>/dev/null || true)"
          payload="$(base64 -w0 release/versions.json)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$GH_REPO/contents/versions.json" \
              -f message="Advance isolated test OTA manifest to $tag" \
              -f content="$payload" -f sha="$existing_sha" -f branch=test-ota >/dev/null
          else
            gh api --method PUT "repos/$GH_REPO/contents/versions.json" \
              -f message="Create isolated test OTA manifest at $tag" \
              -f content="$payload" -f branch=test-ota >/dev/null
          fi

  release-h700:
    name: Publish complete custom firmware for online updates
    # Only a successful push on main may publish. Tag builds still validate
    # firmware but must never move the latest channel backwards.
    # If this tag already has a public release, leave it unchanged.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-h700
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Checkout first: checkout's default clean mode deletes untracked artifacts.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: select-slot-complete-h700
          path: release

      - name: Verify version and archive checksum before publication
        env:
          RELEASE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path("release")
          d = json.loads((root / "versions.json").read_text())["stable"]
          ref = os.environ["RELEASE_REF"]
          if ref.startswith("refs/tags/"):
              assert d["tag"] == ref.removeprefix("refs/tags/"), (d["tag"], ref)
          else:
              assert ref == "refs/heads/main", ref
          # The verified manifest is the single source of truth for this release.
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("RELEASE_TAG=" + d["tag"] + "\n")
          archive = root / d["zip"]
          assert archive.is_file(), d["zip"]
          assert archive.stat().st_size == d["size"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == d["sha256"]
          print("Validated", archive.name, d["sha256"])
          PY

      - name: Publish update assets on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          zip="release/slot-${RELEASE_TAG}-h700.zip"
          test -s "$zip"
          TAG="$RELEASE_TAG"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(rgsp|custom|select)\.([0-9]+)$ ]]; then
            DISPLAY_VERSION="${BASH_REMATCH[1]} Ver. ${BASH_REMATCH[3]}"
          else
            DISPLAY_VERSION="${TAG#v}"
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already published; leaving it unchanged."
            exit 0
          fi
          test -s release/upstream/source-release/mgba-c758314a639aa0066e7b65a8341448181b73c804-source.tar.gz
          gh release create "$RELEASE_TAG" "$zip" release/versions.json \
            release/upstream/source-release/mgba-c758314a639aa0066e7b65a8341448181b73c804-source.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest \
            --title "select. slot. $DISPLAY_VERSION" \
            --notes-file RELEASE_NOTES.md
