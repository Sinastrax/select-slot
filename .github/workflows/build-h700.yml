name: Build select. slot. H700

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "patches/**"
      - ".github/workflows/build-h700.yml"
      - ".github/scripts/**"
      - "branding/**"
  push:
    branches:
      - main
      - integration/slot-1.16.0
    tags:
      - "v*-custom.*"
      - "v*-rgsp.*"
    paths:
      - "patches/**"
      - ".github/workflows/build-h700.yml"
      - ".github/ota-version.txt"
      - ".github/scripts/**"
      - "branding/**"

permissions:
  contents: read

# Rapid cleanup commits should not spawn competing 2-hour ARM builds.
# The release job runs only after its own verified build; canceled runs
# cannot publish.
concurrency:
  group: h700-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-h700:
    runs-on: ubuntu-24.04-arm
    container:
      image: rust:1-bullseye
    timeout-minutes: 120
    steps:
      - name: Checkout modifications
        uses: actions/checkout@v4

      - name: Verify H700 source and release safety contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/h700-prepare.sh
          bash -n .github/scripts/build-stable-mgba.sh
          python3 .github/scripts/verify-h700-maintenance.py

      - name: Fetch pinned Slot sources and apply verified H700 patches
        shell: bash
        run: bash .github/scripts/h700-prepare.sh

      - name: Capture merged source for integration review
        uses: actions/upload-artifact@v4
        with:
          name: select-slot-upstream-merge-inspection
          path: |
            upstream/crates/slot-gfx/src/
            upstream/crates/slot/src/
            upstream/crates/slot-store/src/
            upstream/crates/slot-ui/src/
            upstream/crates/slot-input/src/
            upstream/crates/slot-power/src/
            upstream/pocket-sgb-visual-parity.ppm
            upstream/crates/slot/tests/
          if-no-files-found: error

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip unzip cmake file curl ca-certificates git build-essential pkg-config libpng-dev bison flex bsdextrautils glslang-tools python3-pil
          task_tgz=task_linux_arm64.tar.gz
          curl -fsSLO --http1.1 --retry 5 --retry-delay 10 --retry-all-errors \
            "https://github.com/go-task/task/releases/download/v3.54.0/$task_tgz"
          echo "d7189d439d4a6058e39e1b2acd7c8b27acd4856691b408f23b242e4294e1df5b  $task_tgz" | sha256sum -c -
          tar -xzf "$task_tgz" -C /usr/local/bin task
          rm "$task_tgz"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-all-errors https://bun.sh/install \
              | BUN_INSTALL=/usr/local bash -s "bun-v1.2.6"; then
              break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 10
          done

      - name: Validate generated OpenGL ES 2.0 startup shader
        working-directory: upstream
        shell: bash
        run: python3 ../.github/scripts/check-gles2-shader.py

      - name: Verify OTA release publisher before firmware build
        working-directory: upstream
        shell: bash
        run: python3 ../.github/scripts/verify-ota-publisher.py

      - name: Verify Rust formatting
        working-directory: upstream
        shell: bash
        run: cargo fmt --all

      - name: Verify online-update version comparison and ZIP safety
        working-directory: upstream
        shell: bash
        run: |
          cargo test -p slot --no-default-features --features device --test update -- --nocapture
          cargo test -p slot --no-default-features --features device --lib menu_idle::tests -- --nocapture
          cargo test -p slot --no-default-features --features device --test boot -- --nocapture
          cargo test -p slot --no-default-features --features device --test bezel -- --nocapture
          cargo test -p slot --no-default-features --features device --test update_ui -- --nocapture
          cargo test -p slot --no-default-features --features device --test wifi_ui -- --nocapture
          # link_ui exercises radio hardware; device mode executes the actual
          # /mnt/sdcard/System/slotlink.sh, unavailable in GitHub CI.
          # Run its 58 behavioral tests with the host radio backend while the
          # real device-feature Wi-Fi tests above remain enabled.
          cargo test -p slot --no-default-features --test link_ui -- --nocapture
          cargo test -p slot --no-default-features --features device --test theme_clock -- --nocapture
          cargo test -p slot --no-default-features --features device --lib eject_wifi_policy_regression -- --nocapture
          cargo test -p slot --no-default-features --features device --test menu_status -- --nocapture
          cargo test -p slot-gfx --test placement -- --nocapture
          # Full RetroAchievements regression suite and launch-status label test.
          cargo test -p slot-achievements -- --nocapture
          cargo test -p slot --no-default-features --features device --lib cleanup::tests -- --nocapture
          cargo test -p slot-ui --lib secret_input_test -- --nocapture
          cargo test -p slot-ui --lib select_ra_menu_tests -- --nocapture
          cargo test -p slot-ui --lib menu_viewport_tests -- --nocapture
          cargo test -p slot-ui --lib select_keyboard_shift_tests -- --nocapture
          cargo test -p slot --no-default-features --features device --lib hardware_nickname_regression -- --nocapture
          cargo test -p slot --no-default-features --features device --lib launch_status_distinguishes_real_ra_online_from_wifi_only -- --nocapture

      - name: Brand the boot image and update splash before compiling
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          # Must run before dist:device: the Rust frontend embeds the BMP.
          python3 ../.github/scripts/brand-h700-boot.py card/System
          grep -qF 'say "UPDATING SELECT. SLOT."' card/System/launch_frontend.sh
          ! grep -qF 'say "UPDATING SLOT"' card/System/launch_frontend.sh

      - name: Build the H700 device tree
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          export SLOT_VERSION="$(cat ../.github/ota-version.txt)"
          task dist:device OUT=select-slot-h700

      - name: Add the existing original-GBA bezel to the 640x480 H700 package
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          # Already proven on Miyoo Ver. 2: mugwomp93's Perfect GBA
          # bitmap has the pixel-identical alpha cutout as Slot's AGS-102.
          # Slot 1.8.1 and 1.16.0 contain the same SP asset (Git blob
          # c7bc6119dcb0a37c5fcf118280d28a7658e60dad).
          source="https://raw.githubusercontent.com/chrizzo-hb/knulli-bezels/75aa66c41548ebaa95f31d260d47eea2baab9d8a/default-knulli/systems/gba-4_3.png"
          sha="1d25c249c08580c6082656d353d001158e8378653b9a3d90c80e85700990ca93"
          original="/tmp/h700-perfect-gba.png"
          strip="select-slot-h700/System/bezels"
          test -s "$strip/640x480.png"
          test ! -e "$strip/640x480-gba-original.png"
          curl -fsSL --retry 5 --retry-all-errors "$source" -o "$original"
          echo "$sha  $original" | sha256sum -c -
          python3 - "$original" "$strip/640x480.png" "$strip/640x480-gba-original.png" <<'PY'
          from pathlib import Path
          import sys
          from PIL import Image, ImageChops
          source, old, dest = map(Path, sys.argv[1:])
          with Image.open(source) as im:
              assert im.size == (1024, 768), im.size
              gba = im.convert("RGBA").resize((640, 480), getattr(Image, "Resampling", Image).LANCZOS)
          with Image.open(old) as im:
              sp = im.convert("RGBA")
          assert sp.size == gba.size == (640, 480), "Incorrect bezel size"
          if ImageChops.difference(sp.getchannel("A"), gba.getchannel("A")).getbbox():
              raise SystemExit("Original GBA must match existing SP alpha opening")
          if not ImageChops.difference(sp.convert("RGB"), gba.convert("RGB")).getbbox():
              raise SystemExit("Expected independent original-GBA artwork")
          gba.save(dest, optimize=True)
          with Image.open(dest) as im:
              assert im.convert("RGBA").tobytes() == gba.tobytes()
          print("Verified existing Original GBA 640x480 alpha and picture position")
          PY
          mkdir -p select-slot-h700/System/licenses
          cp ../.github/assets/H700-GBA-BEZEL-CREDITS.txt \
            select-slot-h700/System/licenses/gba-original-bezel-credits.txt

      - name: Replace stock mGBA with the verified older core
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          bash ../.github/scripts/build-stable-mgba.sh select-slot-h700
          # MPL-2.0 allows corresponding source separately. Ship it alongside the binary
          # as an independently downloadable release asset; do not install source on SD2.
          mkdir -p source-release
          mv select-slot-h700/System/licenses/mgba-c758314a639aa0066e7b65a8341448181b73c804-source.tar.gz source-release/
          cat > select-slot-h700/System/licenses/mgba-source-notice.txt <<'NOTICE'
          mGBA core: Mozilla Public License 2.0 (MPL-2.0).
          Copyright mGBA contributors. Source revision:
          https://github.com/libretro/mgba/tree/c758314a639aa0066e7b65a8341448181b73c804
          The complete corresponding source, including our build-time adjustments, is
          distributed alongside each select. slot. H700 firmware binary release at
          https://github.com/Sinastrax/select-slot/releases
          Asset: mgba-c758314a639aa0066e7b65a8341448181b73c804-source.tar.gz
          Build script: .github/scripts/build-stable-mgba.sh in the corresponding tag.
          MPL-2.0 license: https://www.mozilla.org/en-US/MPL/2.0/
          NOTICE
          test -s select-slot-h700/System/licenses/mgba-stable.sha256
          test -s source-release/mgba-c758314a639aa0066e7b65a8341448181b73c804-source.tar.gz
          test ! -e select-slot-h700/System/licenses/mgba-c758314a639aa0066e7b65a8341448181b73c804-source.tar.gz
          test -s select-slot-h700/System/licenses/mgba-source-notice.txt

      - name: Verify the complete firmware tree
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          sh tools/check-card-tree.sh select-slot-h700
          test ! -f select-slot-h700/System/sameboy_libretro.so
          sha256sum -c select-slot-h700/System/licenses/mgba-stable.sha256
          # Both boot scripts and every core must be in an OTA update.
          test -s select-slot-h700/System/launch_frontend.sh
          test -s select-slot-h700/System/bootlogo.bmp
          grep -qF 'say "UPDATING SELECT. SLOT."' select-slot-h700/System/launch_frontend.sh
          # CI must ship the same branded assets as the embedded frontend.
          cmp card/System/bootlogo.bmp select-slot-h700/System/bootlogo.bmp
          grep -qF 'say "UPDATING SELECT. SLOT."' card/System/launch_frontend.sh
          test -s select-slot-h700/System/gpsp_libretro.so
          test -s select-slot-h700/System/gambatte_libretro.so
          test -s select-slot-h700/System/bezels/640x480.png
          test -s select-slot-h700/System/bezels/640x480-gba-original.png
          test -s select-slot-h700/System/licenses/gba-original-bezel-credits.txt

      - name: Package full firmware and OTA release manifest
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat ../.github/ota-version.txt)"
          zip="slot-v${version}-h700.zip"
          zip -qry "../$zip" select-slot-h700
          VERSION="$version" ZIP="$zip" python3 - <<'PY'
          import hashlib, json, os, pathlib
          filename = pathlib.Path("..") / os.environ["ZIP"]
          payload = filename.read_bytes()
          result = {"stable": {
              "version": os.environ["VERSION"],
              "tag": "v" + os.environ["VERSION"],
              "zip": os.environ["ZIP"],
              "size": len(payload),
              "sha256": hashlib.sha256(payload).hexdigest()}}
          pathlib.Path("../versions.json").write_text(json.dumps(result, indent=2) + "\n")
          print(result)
          PY
          unzip -t "../$zip" | tail -1

      - name: Upload complete OTA-ready firmware
        uses: actions/upload-artifact@v4
        with:
          name: select-slot-complete-h700
          path: |
            slot-v*-h700.zip
            versions.json
            upstream/source-release/mgba-*-source.tar.gz
          if-no-files-found: error

  release-h700:
    name: Publish complete custom firmware for online updates
    # Only a successful push on main may publish. Tag builds still validate
    # firmware but must never move the latest channel backwards.
    # If this tag already has a public release, leave it unchanged.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-h700
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Checkout first: checkout's default clean mode deletes untracked artifacts.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: select-slot-complete-h700
          path: release

      - name: Verify version and archive checksum before publication
        env:
          RELEASE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path("release")
          d = json.loads((root / "versions.json").read_text())["stable"]
          ref = os.environ["RELEASE_REF"]
          if ref.startswith("refs/tags/"):
              assert d["tag"] == ref.removeprefix("refs/tags/"), (d["tag"], ref)
          else:
              assert ref == "refs/heads/main", ref
          # The verified manifest is the single source of truth for this release.
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("RELEASE_TAG=" + d["tag"] + "\n")
          archive = root / d["zip"]
          assert archive.is_file(), d["zip"]
          assert archive.stat().st_size == d["size"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == d["sha256"]
          print("Validated", archive.name, d["sha256"])
          PY

      - name: Publish update assets on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          zip="release/slot-${RELEASE_TAG}-h700.zip"
          test -s "$zip"
          TAG="$RELEASE_TAG"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(rgsp|custom|select)\.([0-9]+)$ ]]; then
            DISPLAY_VERSION="${BASH_REMATCH[1]} Ver. ${BASH_REMATCH[3]}"
          else
            DISPLAY_VERSION="${TAG#v}"
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already published; leaving it unchanged."
            exit 0
          fi
          test -s release/upstream/source-release/mgba-c758314a639aa0066e7b65a8341448181b73c804-source.tar.gz
          gh release create "$RELEASE_TAG" "$zip" release/versions.json \
            release/upstream/source-release/mgba-c758314a639aa0066e7b65a8341448181b73c804-source.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest \
            --title "select. slot. $DISPLAY_VERSION" \
            --notes-file RELEASE_NOTES.md
