name: One-time safe release cleanup (26 to 9)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-release-cleanup.yml'

permissions:
  contents: write

jobs:
  curate:
    if: github.repository == 'Sinastrax/select-slot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify release snapshot and remove only explicitly approved trials
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, time
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GITHUB_TOKEN']
          assert repo == 'Sinastrax/select-slot', 'Wrong repository'
          base='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'select-slot-one-time-release-curation'}
          expected=json.loads("{\"v1.16.0-rgsp.40\":451620057,\"v1.16.0-rgsp.39\":451503357,\"v1.16.0-rgsp.38\":451391659,\"v1.16.0-rgsp.37\":451330794,\"v1.16.0-rgsp.36\":450784174,\"miyoo-v1.8.1-ver6\":450765267,\"miyoo-v1.8.1-ver5\":450739780,\"miyoo-v1.8.1-ver4\":450719313,\"v1.16.0-rgsp.35\":450651203,\"v1.16.0-rgsp.34\":450611165,\"v1.16.0-rgsp.33\":450545050,\"v1.16.0-rgsp.32\":450505244,\"v1.16.0-rgsp.31\":450463294,\"v1.16.0-rgsp.30\":450378310,\"v1.16.0-rgsp.29\":450133637,\"v1.16.0-rgsp.28\":450013166,\"v1.16.0-rgsp.27\":449976678,\"v1.16.0-rgsp.26\":449959394,\"v1.16.0-rgsp.25\":449914284,\"v1.16.0-rgsp.24\":449884571,\"v1.16.0-rgsp.18\":449370681,\"miyoo-v1.8.1-ver3\":450704246,\"miyoo-v1.8.1-ver2\":449386924,\"v1.16.0-rgsp.4\":448789687,\"v1.16.0-rgsp.17\":449346097,\"v1.15.3-rgsp.3\":448572971}")
          keep=json.loads("{\"v1.16.0-rgsp.40\":\"select. slot. 1.16.0 Ver. 40 — H700 Stable\",\"v1.16.0-rgsp.36\":\"select. slot. 1.16.0 Ver. 36 — H700 Verified Maintenance\",\"v1.16.0-rgsp.35\":\"select. slot. 1.16.0 Ver. 35 — RetroAchievements Fix\",\"v1.16.0-rgsp.18\":\"select. slot. 1.16.0 Ver. 18 — GBA Authentic Fit\",\"v1.16.0-rgsp.17\":\"select. slot. 1.16.0 Ver. 17 — Pocket Color & SGB\",\"v1.16.0-rgsp.4\":\"select. slot. 1.16.0 Ver. 4 — Authentic Baseline\",\"v1.15.3-rgsp.3\":\"select. slot. 1.15.3 Ver. 3 — Legacy\",\"miyoo-v1.8.1-ver6\":\"select. slot. 1.8.1 Ver. 6 — Miyoo Stable\",\"miyoo-v1.8.1-ver2\":\"select. slot. 1.8.1 Ver. 2 — Miyoo GBA Bezel\"}")
          assert len(expected)==26 and len(keep)==9 and len(set(expected)-set(keep))==17
          def request(method, path, data=None):
              body=json.dumps(data).encode() if data is not None else None
              req=urllib.request.Request('https://api.github.com'+path,data=body,headers=dict(headers,**({'Content-Type':'application/json'} if body else {})),method=method)
              with urllib.request.urlopen(req, timeout=40) as r:
                  b=r.read()
                  return json.loads(b.decode()) if b else None
          def all_releases():
              out=[]; page=1
              while True:
                  segment=request('GET',f'/repos/{repo}/releases?per_page=100&page={page}')
                  out.extend(segment)
                  if len(segment)<100: break
                  page+=1
                  assert page<=5
              return out
          items=all_releases()
          actual={r['tag_name']:r['id'] for r in items}
          assert len(items)==26 and actual==expected, 'Release ID/tag snapshot changed; nothing deleted'
          assert all(not r['draft'] and not r['prerelease'] for r in items), 'unexpected draft/prerelease'
          assert all(r['assets'] for r in items if r['tag_name'] in keep), 'retained release missing assets'
          latest=request('GET',f'/repos/{repo}/releases/latest')
          assert latest['tag_name']=='v1.16.0-rgsp.40', 'latest release is not verified Ver. 40'
          print('VALIDATED: 26 releases; 9 preserved with assets; 17 exact IDs to delete', flush=True)
          for tag in sorted(keep): print('KEEP',tag,'as',keep[tag],flush=True)
          for tag in sorted(set(expected)-set(keep)): print('DELETE RELEASE ONLY; KEEP TAG',tag,expected[tag],flush=True)
          # Rename only retained releases. Never alter their tag, body, assets or published status.
          for tag,newname in keep.items():
              current=next(x for x in items if x['tag_name']==tag)
              if current['name']!=newname:
                  updated=request('PATCH',f'/repos/{repo}/releases/{expected[tag]}',{'name':newname})
                  assert updated['tag_name']==tag and updated['name']==newname
                  print('RENAMED',tag,'->',newname,flush=True)
          # Delete only explicitly captured obsolete RELEASE records. Their Git tags remain intact.
          for tag in sorted(set(expected)-set(keep)):
              release_id=expected[tag]
              before=request('GET',f'/repos/{repo}/releases/{release_id}')
              assert before['id']==release_id and before['tag_name']==tag and not before['draft']
              request('DELETE',f'/repos/{repo}/releases/{release_id}')
              print('REMOVED RELEASE',tag,'id',release_id,'(git tag preserved)',flush=True)
          # Re-read live GitHub data and check both release inventory and latest-release channel.
          after=all_releases()
          assert {r['tag_name']:r['id'] for r in after}=={t:expected[t] for t in keep}, 'Post-cleanup inventory mismatch'
          assert all(r['name']==keep[r['tag_name']] for r in after), 'Title mismatch'
          latest=request('GET',f'/repos/{repo}/releases/latest')
          assert latest['tag_name']=='v1.16.0-rgsp.40', 'Latest OTA release changed'
          assert all(r['assets'] for r in after), 'Missing retained downloads'
          print('SUCCESS: 9 retained releases, renamed consistently; 17 removed; latest Ver.40; tags of older builds preserved.',flush=True)
          PY
