name: Inspect existing original GBA bezels

on:
  push:
    branches: [feature/miyoo-gba-original-bezel]
    paths: [.github/workflows/inspect-gba-bezels.yml]
  workflow_dispatch:

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned existing GBA/AGB and SP bezel artwork
        run: |
          set -euo pipefail
          mkdir -p candidate
          ref=75aa66c41548ebaa95f31d260d47eea2baab9d8a
          base="https://raw.githubusercontent.com/chrizzo-hb/knulli-bezels/$ref"
          curl -fLsS --retry 3 "$base/default-knulli/systems/gba-4_3.png" -o candidate/original-default.png
          curl -fLsS --retry 3 "$base/default-knulli-sp/systems/gba-4_3.png" -o candidate/sp-default.png
          curl -fLsS --retry 3 "$base/mugwomp93-noninteger-nogrids/systems/gba-4_3.png" -o candidate/original-mugwomp.png
          curl -fLsS --retry 3 "$base/mugwomp93-noninteger-nogrids/systems/gba-4_3_sp.png" -o candidate/sp-mugwomp.png
          curl -fLsS --retry 3 "https://raw.githubusercontent.com/slot-cfw/slot/91499a9e09424fd92066b7a97ab3fe0caaf76e24/card/System/bezels/640x480.png" -o candidate/slot-sp.png
          python3 -m pip -q install pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in sorted(Path("candidate").glob("*.png")):
            im=Image.open(p).convert("RGBA")
            print(p, im.size,im.getbbox(),im.getpixel((300,250)),im.getpixel((300,460)))
            print("  bounding:", im.getbbox())
          PY
      - name: Upload original unmodified candidate artwork
        uses: actions/upload-artifact@v4
        with:
          name: existing-gba-bezel-candidates
          path: candidate/
          retention-days: 5
