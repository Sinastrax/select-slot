name: Publish select. slot. Miyoo 1.8.1 Ver. 1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-miyoo-ver1.yml"
  workflow_dispatch:

concurrency:
  group: miyoo-official-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-miyoo:
    if: github.repository == 'Sinastrax/select-slot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout current main source
        uses: actions/checkout@v4

      - name: Install Task
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build complete ARMv7 Miyoo Ver. 1 release
        shell: bash
        run: bash miyoo/build.sh

      - name: Verify Ver. 1 packaging, model-specific hooks and checksums
        shell: bash
        run: |
          set -euo pipefail
          d=.build/miyoo
          archive="$d/select-slot-1.8.1-ver1-miyoo.zip"
          onion="$d/select-slot-1.8.1-ver1-miyoo-onion-autoboot.zip"
          stock="$d/select-slot-1.8.1-ver1-miyoo-stock-autoboot.zip"
          for z in "$archive" "$onion" "$stock"; do
            test -s "$z" && test -s "$z.sha256"
            sha256sum -c "$z.sha256"
            unzip -t "$z" | tail -n 1 | grep -q 'No errors detected'
            unzip -Z1 "$z" | grep -qx 'System/slot'
            unzip -Z1 "$z" | grep -qx 'System/select-slot-version.txt'
            info="$(unzip -p "$z" System/select-slot-version.txt | head -n 1)"
            [[ "$info" == 'select. slot. 1.8.1 Ver. 1 - '* ]]
            ! unzip -p "$z" System/select-slot-version.txt | grep -Fq 'Ver. 26'
            unzip -Z1 "$z" | grep -qx 'App/Slot/config.json'
            unzip -Z1 "$z" | grep -qx 'Apps/slot.pak/config.json'
          done
          ! unzip -Z1 "$archive" | grep -q '^.tmp_update/'
          unzip -Z1 "$onion" | grep -qx '.tmp_update/startup/select-slot.sh'
          ! unzip -Z1 "$onion" | grep -qx '.tmp_update/runtime.sh'
          unzip -Z1 "$stock" | grep -qx '.tmp_update/runtime.sh'
          ! unzip -Z1 "$stock" | grep -qx '.tmp_update/startup/select-slot.sh'
          echo 'Verified all three Version 1 packages and OS-safe hooks'

      - name: Publish Ver. 1, then delete ONLY older Miyoo releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          stable="miyoo-v1.8.1-ver1"
          d=".build/miyoo"
          latest_before="$(gh api "repos/$repo/releases/latest" --jq '.tag_name')"
          [[ "$latest_before" == v*-rgsp.* ]]

          if ! gh release view "$stable" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$stable" \
              "$d/select-slot-1.8.1-ver1-miyoo.zip" \
              "$d/select-slot-1.8.1-ver1-miyoo.zip.sha256" \
              "$d/select-slot-1.8.1-ver1-miyoo-onion-autoboot.zip" \
              "$d/select-slot-1.8.1-ver1-miyoo-onion-autoboot.zip.sha256" \
              "$d/select-slot-1.8.1-ver1-miyoo-stock-autoboot.zip" \
              "$d/select-slot-1.8.1-ver1-miyoo-stock-autoboot.zip.sha256" \
              --repo "$repo" \
              --target "$GITHUB_SHA" \
              --title "select. slot. 1.8.1 Ver. 1 — Miyoo" \
              --notes-file ".github/release-notes/miyoo-ver1.md" \
              --latest=false
          else
            echo 'Release already exists; do not silently overwrite its assets.'
          fi

          # Never run deletion if the replacement is absent/incomplete.
          test "$(gh api "repos/$repo/releases/tags/$stable" --jq '.prerelease')" = false
          test "$(gh api "repos/$repo/releases/tags/$stable" --jq '.draft')" = false
          test "$(gh api "repos/$repo/releases/tags/$stable" --jq '.assets | length')" = 6
          for name in \
            select-slot-1.8.1-ver1-miyoo.zip \
            select-slot-1.8.1-ver1-miyoo-onion-autoboot.zip \
            select-slot-1.8.1-ver1-miyoo-stock-autoboot.zip; do
            gh api "repos/$repo/releases/tags/$stable" --jq '.assets[].name' | grep -Fxq "$name"
          done
          echo 'Ver. 1 is confirmed public and complete; cleaning older Miyoo-only releases.'

          # Strict prefix guard: never delete v*-rgsp.* (H700) or unrelated tags.
          gh api --paginate "repos/$repo/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("miyoo-")) | .tag_name' \
            > /tmp/miyoo_release_tags
          test -s /tmp/miyoo_release_tags
          grep -Fxq "$stable" /tmp/miyoo_release_tags
          while IFS= read -r tag; do
            if [ "$tag" = "$stable" ]; then continue; fi
            [[ "$tag" == miyoo-* ]] || { echo "Invalid cleanup tag: $tag" >&2; exit 1; }
            echo "Removing obsolete Miyoo release and tag: $tag"
            gh release delete "$tag" --repo "$repo" --yes --cleanup-tag
          done < /tmp/miyoo_release_tags

          # Exactly one Miyoo release may remain, with no preview releases.
          count="$(gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[] | select(.tag_name | startswith("miyoo-")) | .tag_name' | tee /tmp/miyoo_remaining | wc -l)"
          test "$count" -eq 1
          grep -Fxq "$stable" /tmp/miyoo_remaining
          latest_after="$(gh api "repos/$repo/releases/latest" --jq '.tag_name')"
          [[ "$latest_after" == v*-rgsp.* ]]
          echo "Miyoo release: $stable (sole remaining Miyoo release)"
          echo "H700 latest untouched: $latest_after"
