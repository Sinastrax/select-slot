name: Curate select. slot. downloads

on:
  push:
    branches: [main]
    paths: [".github/workflows/curate-downloads-once.yml"]

permissions:
  contents: write
  pull-requests: read

jobs:
  curate:
    if: github.repository == 'Sinastrax/select-slot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Retain tested releases and remove superseded downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          kept = {
              "v1.16.0-rgsp.47", "v1.16.0-rgsp.43", "v1.16.0-rgsp.40",
              "v1.16.0-rgsp.36", "v1.16.0-rgsp.35", "v1.16.0-rgsp.18",
              "v1.16.0-rgsp.17", "v1.16.0-rgsp.4", "v1.15.3-rgsp.3",
              "miyoo-v1.8.1-ver12", "miyoo-v1.8.1-ver6", "miyoo-v1.8.1-ver2",
          }
          superseded = {
              "v1.16.0-rgsp.41", "v1.16.0-rgsp.42", "v1.16.0-rgsp.44",
              "v1.16.0-rgsp.45", "v1.16.0-rgsp.46",
              "miyoo-v1.8.1-ver7", "miyoo-v1.8.1-ver8", "miyoo-v1.8.1-ver9",
              "miyoo-v1.8.1-ver10", "miyoo-v1.8.1-ver11",
          }

          def gh(*args):
              return subprocess.check_output(["gh", "api", *args], text=True).strip()

          def releases():
              lines = gh("--paginate", "--jq", ".[] | @json",
                         f"repos/{repo}/releases?per_page=100").splitlines()
              return {item["tag_name"]: item for item in map(json.loads, lines)}

          def latest():
              return gh(f"repos/{repo}/releases/latest", "--jq", ".tag_name")

          def title(tag):
              version, revision = re.fullmatch(
                  r"(?:miyoo-)?v([0-9.]+)-(?:rgsp\.|ver)(\d+)", tag
              ).groups()
              return f"select. slot. {version} Ver. {revision}"

          before = releases()
          assert kept <= before.keys() <= kept | superseded, "Download list changed"
          assert latest() == "v1.16.0-rgsp.47", "Unexpected latest H700 release"
          for tag in kept:
              item = before[tag]
              assert not item["draft"] and not item["prerelease"] and item["assets"], tag
              if item["name"] != title(tag):
                  gh("--method", "PATCH", f"repos/{repo}/releases/{item['id']}", "-f", f"name={title(tag)}")

          for tag in sorted(superseded & before.keys()):
              gh("--method", "DELETE", f"repos/{repo}/releases/{before[tag]['id']}")
              print(f"Removed release {tag}", flush=True)

          after = releases()
          assert set(after) == kept and latest() == "v1.16.0-rgsp.47"
          for tag in kept:
              assert after[tag]["name"] == title(tag)
              assert {a["id"] for a in after[tag]["assets"]} == {a["id"] for a in before[tag]["assets"]}
          for tag in sorted(superseded):
              gh(f"repos/{repo}/git/ref/tags/{tag}", "--jq", ".object.sha")

          branch = "feature/keyboard-one-shot-shift-caps-lock"
          branch_ref = f"repos/{repo}/git/ref/heads/{branch}"
          refs = gh(f"repos/{repo}/branches", "--jq", ".[].name").splitlines()
          if branch in refs:
              tip = gh(branch_ref, "--jq", ".object.sha")
              assert tip == "4715458f84f18c2e9637c2ac28e75e3579bed9c7", "Keyboard branch advanced"
              assert gh(f"repos/{repo}/compare/{tip}...main", "--jq", ".behind_by") == "0"
              owner = repo.split("/")[0]
              assert gh(f"repos/{repo}/pulls?state=open&head={owner}:{branch}", "--jq", "length") == "0"
              gh("--method", "DELETE", f"repos/{repo}/git/refs/heads/{branch}")
              print(f"Removed merged branch {branch}", flush=True)
          PY
