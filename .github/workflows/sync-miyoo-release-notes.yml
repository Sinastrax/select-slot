name: Sync Miyoo Ver. 1 public release description

on:
  push:
    branches: [main]
    paths:
      - ".github/release-notes/miyoo-ver1.md"
      - ".github/workflows/sync-miyoo-release-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-miyoo-release-description:
    if: github.repository == 'Sinastrax/select-slot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current release notes
        uses: actions/checkout@v4

      - name: Update release description without changing any assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="miyoo-v1.8.1-ver1"
          notes=".github/release-notes/miyoo-ver1.md"
          test -s "$notes"
          if grep -Eqi 'brightness|b[- /]button|b[[:space:]]*/[[:space:]]*back' "$notes"; then
            echo "Remove internal navigation/brightness details from public notes" >&2
            exit 1
          fi

          latest_before="$(gh api "repos/$repo/releases/latest" --jq .tag_name)"
          [[ "$latest_before" == v*-rgsp.* ]]
          gh api "repos/$repo/releases/tags/$tag" --jq '.assets[] | [.id,.name,.size] | @tsv' > before-assets.tsv
          test "$(wc -l < before-assets.tsv)" -eq 6

          gh release edit "$tag" --repo "$repo" --notes-file "$notes"

          gh api "repos/$repo/releases/tags/$tag" --jq .body > actual-notes.md
          cmp -s "$notes" actual-notes.md
          gh api "repos/$repo/releases/tags/$tag" --jq '.assets[] | [.id,.name,.size] | @tsv' > after-assets.tsv
          cmp -s before-assets.tsv after-assets.tsv
          test "$(gh api "repos/$repo/releases/tags/$tag" --jq .prerelease)" = false
          test "$(gh api "repos/$repo/releases/latest" --jq .tag_name)" = "$latest_before"
          echo "Miyoo release copy updated; assets and H700 latest preserved"
